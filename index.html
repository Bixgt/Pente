<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>Pente</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pente">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root {
  --bg: #14161b;
  --panel: #1d2027;
  --panel-2: #262a33;
  --text: #eef0f4;
  --muted: #9aa1ad;
  --accent: #e8b04a;
  --p1: #111;
  --p2: #f4f1ea;
  --danger: #e5604f;
  --radius: 14px;
  --gutter: 16px;
  --line: #343a46;
  --accent-ink: #1a1405;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'PenteSans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: flex; flex-direction: column; min-height: 100%; max-width: 1000px; margin: 0 auto; padding: 12px var(--gutter) calc(12px + env(safe-area-inset-bottom)); gap: 12px; }

.hud { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.player { background: var(--panel); border-radius: var(--radius); padding: 10px 12px; border: 2px solid transparent; transition: border-color .15s, background .15s; min-width: 0; }
.player.active { border-color: var(--accent); background: var(--panel-2); }
.player .row { display: flex; align-items: center; gap: 8px; }
.stone-ico { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: inset 0 -2px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.5); }
.stone-ico.s1 { background: radial-gradient(circle at 35% 30%, var(--s1a), var(--s1b) 75%); }
.stone-ico.s2 { background: radial-gradient(circle at 35% 30%, var(--s2a), var(--s2b) 75%); }
.stone-ico.s3 { background: radial-gradient(circle at 35% 30%, var(--s3a), var(--s3b) 75%); }
.stone-ico.s4 { background: radial-gradient(circle at 35% 30%, var(--s4a), var(--s4b) 75%); }
.player .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .caps { margin-top: 8px; display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.pip { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--muted); }
.pip.on { background: var(--accent); border-color: var(--accent); }

/* Reserva dos renglones siempre: si el aviso se hace largo, el tablero NO se mueve (con el dedo encima sería un desastre). */
.status { text-align: center; font-weight: 600; min-height: 2.8em; display: flex; align-items: center; justify-content: center; line-height: 1.35; }
.status .toast { color: var(--accent); }

.board-wrap { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
#board { display: block; width: min(100%, calc(100vh - 255px), 900px); aspect-ratio: 1 / 1; max-width: 100%; border-radius: 10px; touch-action: none; box-shadow: var(--board-shadow, 0 10px 30px rgba(0,0,0,.45)); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 48px; }
.actions .btn { white-space: nowrap; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; min-height: 48px; font-weight: 600; }
.btn:hover { filter: brightness(1.15); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn:focus-visible, input:focus-visible { outline: 3px solid #79b8ff; outline-offset: 2px; }

.overlay { position: fixed; inset: 0; background: rgba(8,9,12,.72); display: none; align-items: center; justify-content: center; padding: var(--gutter); z-index: 10; }
.overlay.open { display: flex; }
.modal { background: var(--panel); border-radius: 18px; padding: 22px; width: min(100%, 440px); max-height: 92vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.modal h1, .modal h2 { margin: 0 0 6px; }
.modal p.sub { margin: 0 0 16px; color: var(--muted); }
.field { margin: 12px 0; }
.field label.lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input[type=text], .field input[type=email], .field input[type=password] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; }
.check input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.check small { display: block; color: var(--muted); margin-top: 2px; }
.modal .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.rules ol { padding-left: 20px; line-height: 1.5; color: #d6dae2; }
.endtitle { font-size: 20px; font-weight: 800; margin: 0 0 14px; }

@media (max-width: 520px) {
  .app { padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); gap: 8px; }
  #board { border-radius: 6px; }
  .player { padding: 8px 10px; }
  #board { width: min(100%, calc(100vh - 255px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Selector de tablero */
.themes { display: flex; gap: 10px; }
.theme-opt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; min-height: 48px; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; font-weight: 600; }
.theme-opt[aria-pressed="true"] { border-color: var(--accent); }
.theme-opt .swatch { position: relative; width: 100%; height: 44px; border-radius: 8px; display: block; overflow: hidden; }
.theme-opt .swatch i { position: absolute; top: 12px; width: 20px; height: 20px; border-radius: 50%; }
.theme-opt .swatch i:nth-child(1) { left: 28%; }
.theme-opt .swatch i:nth-child(2) { left: 52%; }
.btn[hidden] { display: none; }

/* Online */
.player.offline { opacity: .55; }
.hint { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
.or { text-align: center; color: var(--muted); margin: 18px 0 4px; font-size: 13px; }
.field input.code-input { text-align: center; letter-spacing: .35em; font-weight: 800; font-size: 20px; text-transform: uppercase; }
.online-msg { min-height: 1.4em; margin: 12px 0 0; color: var(--accent); font-size: 14px; text-align: center; }
.roomcode { text-align: center; font-size: 40px; font-weight: 800; letter-spacing: .3em; padding: 14px 0 14px .3em; margin: 6px 0 4px; background: var(--bg); border-radius: 12px; border: 2px dashed var(--line); user-select: all; }

/* Tamaño del tablero */
.seg { display: flex; gap: 8px; }
.seg-opt { flex: 1; min-height: 48px; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; font-weight: 700; }
.seg-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); }
#btnConfirm { flex: 1 1 auto; max-width: 260px; }
@media (max-width: 520px) { .actions .btn { padding: 12px 12px; } }

/* Configuración */
.modal.settings { width: min(100%, 480px); }
.tabs { display: flex; gap: 6px; margin: 12px 0 8px; }
.tab { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 8px 4px; font-size: 14px; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; font-weight: 700; white-space: nowrap; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--panel-2); }
.tabpanel { padding-top: 4px; }
.tabpanel[hidden] { display: none; }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.seg-opt { padding: 8px; }
@media (max-width: 400px) { .modal.settings { padding: 18px 14px; } .tab { font-size: 13px; padding: 8px 2px; } }
@media (max-width: 340px) { .tab { font-size: 12px; } }
@media (max-width: 340px) { .tabs { gap: 4px; } .tab { padding: 8px 0; font-size: 12px; } .modal.settings { padding: 16px 10px; } }

/* ---------- Pantallas completas (menú aparte del juego) ---------- */
.overlay.screen { background: var(--bg); align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(var(--gutter), env(safe-area-inset-top)) var(--gutter) max(var(--gutter), env(safe-area-inset-bottom)); z-index: 20; }
.screen-body { width: min(100%, 480px); margin: 0 auto; padding: 8px 0 24px; }
#menuOverlay .screen-body { margin: auto; }
.screen-body h1, .screen-body h2 { margin: 0 0 6px; }
.screen-body p.sub { margin: 0 0 16px; color: var(--muted); }
.screen-body .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.screen-body.settings { width: min(100%, 520px); }
.brand { text-align: center; margin: 4vh 0 28px; }
.brand h1 { font-size: clamp(44px, 14vw, 72px); letter-spacing: .06em; font-weight: 800; }
body.in-screen .app { visibility: hidden; }
.specbar { text-align: center; font-size: 14px; color: var(--muted); padding: 2px 0 4px; }
.specbar[hidden] { display: none; }
.roomlist { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.room { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.room .info { flex: 1; min-width: 0; }
.room .who { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.room .btn { flex: none; min-height: 44px; padding: 8px 16px; }
.room-empty { text-align: center; color: var(--muted); padding: 24px 8px; border: 2px dashed var(--line); border-radius: 14px; }

/* ---------- Jugadas y chat ---------- */
.stage { flex: 1 1 auto; display: flex; gap: 12px; min-height: 0; }
.stage .board-wrap { flex: 1 1 auto; min-width: 0; }
.side { flex: none; }
.side-inner { display: flex; flex-direction: column; gap: 10px; }
.side-head { display: none; }
.box { background: var(--panel); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; min-height: 0; gap: 8px; }
.box[hidden], .btn[hidden], .badge[hidden], .tab[hidden] { display: none; }
.box h3 { margin: 0; font-size: 15px; }
.box-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.box .hint { margin: 0; font-size: 12px; }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.box-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.box-actions .btn { flex: 1 1 auto; min-height: 40px; padding: 8px 10px; font-size: 14px; }
.movelist { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1 1 auto; min-height: 90px; font-variant-numeric: tabular-nums; }
.movelist li { display: grid; grid-template-columns: 2.2em 1fr 1fr; gap: 6px; padding: 3px 4px; border-radius: 8px; font-size: 14px; }
.movelist li.last { background: var(--panel-2); }
.movelist .mn { color: var(--muted); }
.movelist .mv { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.movelist .mv::before { content: ''; width: 11px; height: 11px; border-radius: 50%; flex: none; }
.movelist .mv[data-p="1"]::before { background: radial-gradient(circle at 35% 30%, var(--s1a), var(--s1b)); }
.movelist .mv[data-p="2"]::before { background: radial-gradient(circle at 35% 30%, var(--s2a), var(--s2b)); box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.movelist .mv[data-p="3"]::before { background: radial-gradient(circle at 35% 30%, var(--s3a), var(--s3b)); }
.movelist .mv[data-p="4"]::before { background: radial-gradient(circle at 35% 30%, var(--s4a), var(--s4b)); }
.movelist .cap { color: var(--accent); font-size: 12px; font-weight: 700; }
.movelist .empty { display: block; color: var(--muted); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 12px; line-height: 18px; text-align: center; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 30px; padding: 2px 10px; border-radius: 15px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--danger); color: var(--muted); text-decoration: line-through; }
.chatlog { overflow-y: auto; flex: 1 1 auto; min-height: 110px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; overflow-wrap: anywhere; }
.chatlog .msg b { font-weight: 700; margin-right: 6px; }
.chatlog .msg .s1 { color: #8ec5ff; } .chatlog .msg .s2 { color: #ffb38e; } .chatlog .msg .s0 { color: var(--muted); }
.chatlog .note { color: var(--muted); font-size: 13px; }
.chatform { display: flex; gap: 8px; }
.chatform input { flex: 1 1 auto; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 16px; }
.chatform .btn { min-height: 44px; padding: 8px 14px; }
#btnSide { white-space: nowrap; }

@media (min-width: 1100px) {
  .app { max-width: 1300px; }
  /* Escritorio: jugadas a la IZQUIERDA, tablero al centro, chat a la DERECHA. Columnas iguales => el tablero y los textos quedan centrados. */
  .stage { display: grid; grid-template-columns: 250px minmax(0, 1fr) var(--chatw, 320px); grid-template-rows: minmax(0, 1fr); gap: 12px; }
  .side, .side-inner { display: contents; }
  .stage > .board-wrap { grid-column: 2; grid-row: 1; }
  #movesBox { grid-column: 1; grid-row: 1; contain: size; }       /* contain: size => el panel no estira el tablero, se adapta a su alto */
  #chatBox { grid-column: 3; grid-row: 1; contain: size; position: relative; }
  #btnChatShow { grid-column: 3; grid-row: 1; align-self: start; }
  .sidebar-row { display: none; }
}
@media (max-width: 1099px) {
  .side { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; height: var(--sideh, auto); max-height: var(--sideh, 72vh); display: none; background: var(--bg); border-top: 2px solid var(--line); border-radius: 18px 18px 0 0; padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -12px 40px rgba(0,0,0,.55); }
  .side.open { display: block; }
  .side-inner { height: var(--sideh-in, auto); max-height: calc(var(--sideh, 72vh) - 34px); }
  .side-inner > .box { flex: 1 1 auto; }
  .side-head { display: flex; align-items: center; gap: 8px; }
  .side-tabs { display: flex; gap: 8px; flex: 1; }
  .side-tabs .tab { flex: 1; }
  .btn.x { min-height: 44px; min-width: 44px; padding: 0; }
  .side[data-tab="moves"] #chatBox, .side[data-tab="moves"] #btnChatShow { display: none; }
  .side[data-tab="chat"] #movesBox { display: none; }
  .side .box { overflow: hidden; }
  .movelist, .chatlog { max-height: calc(var(--sideh, 72vh) - 210px); min-height: 90px; }
}
[data-mode][hidden] { display: none; }

/* ---------- Reloj ---------- */
.clock { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.clock[hidden] { display: none; }
.clock .ctot { font-size: 15px; color: var(--muted); }
.clock .cturn { font-size: 17px; color: var(--text); }
.clock .cturn:empty { display: none; }
.player.active .clock .ctot { color: var(--text); }
.clock.low .cturn, .clock.low .ctot { color: var(--danger); }
.clock.low .cturn { animation: clockPulse 1s ease-in-out infinite; }
@keyframes clockPulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .clock.low .cturn { animation: none; } }

/* ---------- Video ---------- */
.videobox { margin: 12px 0; background: #000; border-radius: 12px; overflow: hidden; }
.videobox canvas, .videobox video { display: block; width: 100%; height: auto; max-height: 62vh; object-fit: contain; margin: 0 auto; }
.videobox canvas[hidden], .videobox video[hidden] { display: none; }
.progress { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.progress[hidden] { display: none; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }

html[data-theme="papel"] .brand h1 { font-family: 'PenteMano', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
html[data-theme="papel"] body { font-family: 'PenteMano', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .02em; }
html[data-theme="papel"] #chatBox, html[data-theme="papel"] #chatBox * , html[data-theme="papel"] .chatform input { font-family: 'PenteSans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: normal; }
html[data-theme="papel"] .btn, html[data-theme="papel"] .tab, html[data-theme="papel"] .seg-opt { font-size: 1.1em; }
html[data-theme="papel"] .status { font-size: 1.1em; }
html[data-theme="papel"] .clock, html[data-theme="papel"] .clock * { font-family: 'PenteSans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: normal; }   /* los números del reloj, siempre claros */

/* ---------- Tutorial interactivo ---------- */
.tut-card { display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 2px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; min-height: 0; overflow-y: auto; }
.tut-card[hidden] { display: none; }
.tut-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tut-step { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.tut-title { margin: 0; font-size: 17px; line-height: 1.2; }
.tut-text { margin: 0; font-size: 14.5px; line-height: 1.4; color: var(--text); }
.tut-fb { margin: 0; font-size: 14px; line-height: 1.35; font-weight: 600; min-height: 1.35em; }
.tut-fb.good { color: #5fd694; }
.tut-fb.bad { color: var(--danger); }
.tut-fb.hint { color: var(--accent); }
.tut-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.tut-btns .btn { flex: 1 1 auto; min-height: 44px; padding: 8px 12px; }
.tut-btns .btn[hidden] { display: none; }
.tut-btns .btn:disabled { opacity: .4; cursor: default; }
html[data-theme="papel"] .tut-card { border-color: var(--line); }
/* En el tutorial no hay jugadas, chat, menú ni reinicio: solo el tablero y la tarjeta */
body.in-tut .status, body.in-tut #btnMenu, body.in-tut #btnRestart, body.in-tut #btnClaim, body.in-tut .sidebar-row, body.in-tut #movesBox, body.in-tut #chatBox, body.in-tut #btnChatShow { display: none !important; }
@media (min-width: 1100px) {
  .tut-card { grid-column: 1; grid-row: 1; contain: size; }
}
@media (max-width: 1099px) {
  /* Celular: arriba los jugadores, después el tablero (siempre en el mismo lugar), el botón Confirmar y abajo la tarjeta con la lección */
  body.in-tut .stage { display: contents; }
  body.in-tut .board-wrap { order: 1; flex: none; }
  body.in-tut .actions { order: 2; min-height: 0; }
  body.in-tut .tut-card { order: 3; flex: 1 0 auto; min-height: 150px; padding: 10px 12px; gap: 6px; overflow: visible; }
  body.in-tut .tut-title { font-size: 15px; }
  body.in-tut .tut-text { font-size: 13.5px; line-height: 1.32; }
  body.in-tut .tut-fb { font-size: 13.5px; }
  body.in-tut .tut-btns { margin-top: 4px; }
  body.in-tut .tut-btns .btn { min-height: 42px; padding: 4px 8px; font-size: 14px; }
  body.in-tut #board { width: min(100%, max(260px, calc(100vh - 365px)), 900px); }
}

/* ---------- Perfil ---------- */
.avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.avatar-opt { aspect-ratio: 1; min-height: 44px; font-size: 26px; line-height: 1; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 0; }
.avatar-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); }
.prof-stats { display: grid; grid-template-columns: 1fr repeat(4, 3.6em); gap: 4px 6px; font-size: 14px; align-items: center; font-variant-numeric: tabular-nums; }
.prof-stats .h { color: var(--muted); font-size: 12px; text-align: right; font-weight: 700; }
.prof-stats .h:first-child { text-align: left; }
.prof-stats .m { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prof-stats .n { text-align: right; }
.prof-stats .n.z { color: var(--muted); }
.prof-stats .row-sep { grid-column: 1 / -1; height: 1px; background: var(--line); }
#profNote { margin: 8px 0 0; }
@media (max-width: 360px) { .prof-stats { font-size: 13px; grid-template-columns: 1fr repeat(4, 3em); } .prof-stats .h { font-size: 11px; } }

/* ---------- Cartel de confirmación y niveles ---------- */
.overlay.dialog { z-index: 40; background: rgba(8,9,12,.78); }
.modal.dlg { width: min(100%, 380px); padding: 20px; border: 2px solid var(--line); }
.modal.dlg p { margin: 0 0 18px; font-size: 17px; line-height: 1.4; font-weight: 600; }
.dlg-btns { display: flex; gap: 10px; }
.dlg-btns .btn { flex: 1 1 0; min-width: 0; }
.seg.seg4 { display: grid; grid-template-columns: 1fr 1fr; }
html[data-theme="papel"] .modal.dlg p { font-size: 1.15em; }

/* ---------- Color de las piedras (tablero Tradicional) ---------- */
.gem-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.gem-who { flex: 0 0 5.6em; font-size: 14px; color: var(--muted); font-weight: 600; }
.gem-picker { display: flex; flex-wrap: wrap; gap: 8px; }
.gem-opt { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--line); padding: 0; position: relative; box-shadow: inset 0 -3px 5px rgba(0,0,0,.35); }
.gem-opt::after { content: ''; position: absolute; left: 22%; top: 16%; width: 34%; height: 20%; border-radius: 50%; background: rgba(255,255,255,.8); transform: rotate(-35deg); }
.gem-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent), inset 0 -3px 5px rgba(0,0,0,.35); }

/* ---------- Cuenta ---------- */
.acct { border-top: 1px solid var(--line); padding-top: 14px; }
.acct input { margin-top: 8px; }
.acct .btns { margin-top: 10px; flex-wrap: wrap; }
.acct .who { margin: 4px 0 0; font-weight: 700; word-break: break-all; }
.auth-msg { min-height: 1.4em; }
.auth-msg.bad { color: var(--danger); font-weight: 600; }
.auth-msg.good { color: var(--accent); font-weight: 600; }

/* ---------- Agrandar el chat ---------- */
.grip { touch-action: none; }
.grip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grip-chat { display: none; }
.grip-sheet { display: none; }
@media (min-width: 1100px) {
  .grip-chat { display: block; position: absolute; left: -2px; top: -2px; width: 26px; height: 26px; cursor: nwse-resize; z-index: 3; border-top-left-radius: var(--radius);
    background: linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 7px, var(--accent) 7px 10px, transparent 10px 14px, var(--accent) 14px 17px, transparent 17px); opacity: .55; clip-path: polygon(0 0, 100% 0, 0 100%); }
  .grip-chat:hover, .grip-chat.drag { opacity: 1; }
}
@media (max-width: 1099px) {
  .grip-sheet { display: block; width: 100%; height: 22px; margin: -4px 0 4px; cursor: ns-resize; position: relative; }
  .grip-sheet::after { content: ''; position: absolute; left: 50%; top: 8px; width: 54px; height: 5px; margin-left: -27px; border-radius: 3px; background: var(--line); }
  .grip-sheet:hover::after, .grip-sheet.drag::after { background: var(--accent); }
}

.claim-row { display: flex; gap: 8px; } .claim-row input { flex: 1 1 auto; min-width: 0; width: auto; } .claim-row .btn { min-height: 0; padding: 10px 14px; }
input.locked { opacity: .75; cursor: not-allowed; }
#claimMsg.ok { color: var(--ok, #6fcf8e); } #claimMsg.bad { color: var(--danger, #e5604f); }

.lobby { margin: 14px 0 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
.lobby-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lobbylog { min-height: 120px; max-height: 220px; flex: none; }
.lobby[hidden] { display: none; }

/* ---------- Torneos ---------- */
.screen-body.wide { max-width: 760px; }
.tn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 12px; }
.screen-body select, .screen-body textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; color: var(--text); font: inherit; }
.screen-body textarea { resize: vertical; }
.tn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 8px 0; } .tn-row select { width: auto; flex: 1 1 140px; padding: 8px; }
.btn.small { min-height: 0; padding: 8px 12px; font-size: 14px; } .btn.ghost { background: transparent; } .btn.danger { color: var(--danger, #e5604f); }
.btn.tn-sug { display: block; width: 100%; text-align: left; margin: 6px 0; min-height: 0; }
.tn-h { font-size: 15px; margin: 14px 0 6px; } .tn-line { font-size: 14px; } .tn-ok { color: var(--ok, #6fcf8e); font-size: 14px; margin: 3px 0; } .tn-err { color: var(--danger, #e5604f); margin: 4px 0; } .tn-warn { color: var(--accent); font-size: 13px; margin: 4px 0; }
.tn-tabs { display: flex; gap: 6px; margin: 12px 0; } .tn-tabs button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 600; min-height: 40px; }
.tn-tabs button[aria-pressed=true] { background: var(--accent); color: #1a1405; border-color: var(--accent); }
.tn-champ { font-size: 22px; color: var(--accent); margin: 6px 0; font-weight: 800; }
.tn-round { margin: 10px 0 14px; }
.tn-duel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-size: 14px; }
.tn-duel.done { opacity: .88; } .tn-p { display: flex; justify-content: space-between; gap: 8px; } .tn-p.w b { color: var(--ok, #6fcf8e); } .tn-p.l { color: var(--muted); } .tn-tbd { color: var(--muted); font-style: italic; }
.tn-meta { font-size: 12px; color: var(--muted); margin-top: 4px; } .tn-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tn-bracket { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; } .tn-col { flex: 1 0 200px; min-width: 200px; display: flex; flex-direction: column; } .tn-col h4 { text-align: center; margin: 0 0 6px; font-size: 14px; }
.tn-colin { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.tn-tw { overflow-x: auto; } .tn-tw table { width: 100%; border-collapse: collapse; font-size: 14px; } .tn-tw th, .tn-tw td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); } .tn-tw th:nth-child(2), .tn-tw td:nth-child(2) { text-align: left; } .tn-tw th { color: var(--muted); font-weight: 600; font-size: 12px; }
.tn-tw tr.champ td { color: var(--accent); font-weight: 700; } .tn-tw tr.out td { color: var(--muted); }
.tn-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tn-acts .tn-meta{margin-top:2px}
.tn-acts{flex-direction:column;align-items:stretch}

/* ---- Fixture de torneos: colores propios de cada temática ---- */
html { --tn-card: var(--panel-2); --tn-line: var(--line); --tn-win: var(--accent); --tn-lose: var(--muted); --tn-pend: var(--accent); --tn-glow: none; --tn-zebra: rgba(255,255,255,.03); --tn-head: var(--accent); }
.tn-duel { background: var(--tn-card); border: 1px solid var(--tn-line); box-shadow: var(--tn-glow); }
.tn-duel:not(.done) { border-left: 3px solid var(--tn-pend); }
.tn-p.w b { color: var(--tn-win); }
.tn-p.l { color: var(--tn-lose); }
.tn-champ, .tn-tw tr.champ td { color: var(--tn-win); }
.tn-h { color: var(--tn-head); }
.tn-tw tr:nth-child(even) td { background: var(--tn-zebra); }
.tn-tw th { color: var(--tn-head); }
html[data-theme="clasico"] { --tn-card: #20242c; --tn-line: #343a46; --tn-win: #e8b04a; --tn-lose: #7d8594; --tn-pend: #e8b04a; --tn-head: #e8b04a; }
html[data-theme="tradicional"] { --tn-card: linear-gradient(180deg, #3d2c20, #2f2219); --tn-line: #6a4f3a; --tn-win: #f3cf88; --tn-lose: #9a8470; --tn-pend: #d9954a; --tn-head: #e0a458; --tn-zebra: rgba(224,164,88,.07); --tn-glow: inset 0 1px 0 rgba(255,225,170,.12), 0 1px 3px rgba(0,0,0,.4); }
html[data-theme="glow"] { --tn-card: linear-gradient(180deg, #172058, #101745); --tn-line: #3a4cc0; --tn-win: #7cf0ff; --tn-lose: #8a93d8; --tn-pend: #ff4fb0; --tn-head: #7cf0ff; --tn-zebra: rgba(124,240,255,.05); --tn-glow: 0 0 10px rgba(80,110,255,.28); }
html[data-theme="glow"] .tn-p.w b, html[data-theme="glow"] .tn-champ { text-shadow: 0 0 8px rgba(124,240,255,.7); }
html[data-theme="glow"] .tn-duel:not(.done) { box-shadow: 0 0 12px rgba(255,79,176,.28); }
html[data-theme="papel"] { --tn-card: #2a2b36; --tn-line: #6b70a8; --tn-win: #b9c2ff; --tn-lose: #8789a6; --tn-pend: #8d9bff; --tn-head: #b9c2ff; --tn-zebra: rgba(141,155,255,.06); }
html[data-theme="papel"] .tn-duel { border-style: dashed; }
html[data-theme="papel"] .tn-p.l span:first-child { text-decoration: line-through; text-decoration-thickness: 1px; }

.size-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.size-col .seg-opt { width: 100%; flex: none; }
.size-sub { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.2; }

/* Botón Confirmar: fijo; apagado (en el tono de cada temática) cuando no hay jugada para confirmar */
.btn:disabled, .btn.primary:disabled { background: var(--panel-2); color: var(--muted); border-color: var(--line); opacity: .55; cursor: default; filter: none; }

/* Secciones plegables (Opciones de partida, Unirse a sala, Crear sala) */
.acc { display: block; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); margin: 10px 0; text-align: left; }
.acc-head { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 12px 14px; font-weight: 700; background: transparent; border: 0; border-radius: 12px; color: inherit; text-align: left; }
.acc-sum { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 500; text-align: right; }
.acc-chev { flex: none; width: 9px; height: 9px; margin: 0 4px 3px auto; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .15s; opacity: .8; }
.acc-sum + .acc-chev { margin-left: 8px; }
.acc-head[aria-expanded="true"] .acc-chev { transform: rotate(-135deg); margin-bottom: -3px; }
.acc-body { padding: 2px 14px 14px; }
.acc-body[hidden] { display: none; }
.acc-inner { background: var(--bg); }
.acc-link { padding: 0; cursor: pointer; color: inherit; font: inherit; }
.acc-link .acc-chev { transform: rotate(-45deg); margin-bottom: 0; }
.acc-link:hover { filter: brightness(1.12); }

/* Amigos y perfil de otra persona */
.fr-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); margin: 6px 0; }
.fr-av { font-size: 24px; line-height: 1; }
.fr-name { flex: 1; min-width: 0; text-align: left; background: none; border: 0; font-weight: 700; color: inherit; padding: 8px 0; min-height: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fr-btns { display: flex; gap: 6px; flex: none; }
#frMsg.bad, #pvMsg.bad { color: var(--danger, #e5604f); }
.pv-head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.pv-av { font-size: 54px; line-height: 1; }
.pv-head h2 { margin: 0; }
.dlg-btns.col { flex-direction: column; }
.prof-stats[hidden] { display: none; }
#loginMode { margin-bottom: 10px; }
#loginPwBox input, #loginMailBox input, #pwForm input { margin-bottom: 8px; }
.pw-set { margin: 12px 0; padding-top: 10px; border-top: 1px solid var(--line); }
.pw-set[hidden], #pwForm[hidden], #loginPwBox[hidden], #loginMailBox[hidden] { display: none; }

.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 52px; margin-bottom: 8px; }
.pw-eye { position: absolute; right: 4px; top: 0; height: 46px; width: 46px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--muted); cursor: pointer; border-radius: 10px; }
.pw-eye:hover, .pw-eye:focus-visible { color: var(--text); }
.pw-eye .eye-off { display: none; }
.pw-eye[aria-pressed="true"] .eye-on { display: none; }
.pw-eye[aria-pressed="true"] .eye-off { display: block; }

.brand .ver { font-size: 11px; opacity: .45; margin: 4px 0 0; letter-spacing: .08em; }

/* Menú: cuadrados arriba (opciones e idioma a la izquierda, perfil a la derecha) */
.menu-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.menu-top-l { display: flex; gap: 10px; }
.sq { position: relative; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; color: var(--text); cursor: pointer; padding: 0; }
.sq:hover, .sq:focus-visible { border-color: var(--accent); }
.sq:active { transform: translateY(1px); }
.sq-av { font-size: 30px; line-height: 1; }
.sq-tag { position: absolute; right: 4px; bottom: 3px; font-size: 10px; font-weight: 800; letter-spacing: .04em; color: var(--accent); line-height: 1; }
.btn .badge { display: inline-block; min-width: 22px; height: 22px; margin-left: 8px; padding: 0 6px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-size: 13px; line-height: 22px; text-align: center; vertical-align: middle; }
.btn .badge[hidden] { display: none; }
#frNeedBtns[hidden] { display: none; }

/* Gráficos de estadísticas */
:root { --st-w: #5dd39e; --st-l: #ef6b6b; --st-d: #9aa1ad; }
.charts { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.charts[hidden] { display: none; }
.ch-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.ch-card h4 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
.ch-stack { display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: var(--bg); gap: 2px; }
.ch-stack .seg { min-width: 6px; }
.ch-stack .seg.w, .dot.w { background: var(--st-w); } .ch-stack .seg.l, .dot.l { background: var(--st-l); } .ch-stack .seg.d, .dot.d { background: var(--st-d); }
.ch-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; }
.ch-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.ch-row { display: grid; grid-template-columns: 9.5em 1fr auto; gap: 8px; align-items: center; margin: 7px 0; font-size: 13px; }
.ch-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-track { height: 12px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.ch-fill { display: block; height: 100%; border-radius: 6px; background: var(--st-w); }
.ch-fill.alt { background: var(--accent); }
.ch-val { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; min-width: 4.5em; }

/* Modo 4 jugadores: asientos en la sala de espera */
.seats { display: grid; gap: 6px; margin: 10px 0; }
.seats[hidden] { display: none; }
.seats .seat { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line, #3a3f4b); opacity: .6; font-weight: 600; }
.seats .seat.on { opacity: 1; }
.seats .seat.me { border-color: var(--accent, #e8b04a); }

/* Menú principal: letras normales (sin negrita) */
#menuOverlay .btn { font-weight: 400; }

.seats .seat.free { background: transparent; color: inherit; text-align: left; cursor: pointer; border-style: dashed; font: inherit; font-weight: 600; opacity: .85; }
.seats .seat.free:hover { border-color: var(--accent, #e8b04a); }
.seats .hint { margin: 2px 2px 0; }

/* 2 contra 2 sin conexión: lista de asientos */
.l4rows { display: grid; gap: 8px; margin: 8px 0 12px; }
.l4row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.l4tag { font-size: 13px; color: var(--muted); white-space: nowrap; min-width: 78px; }
.l4row input { min-width: 0; }
.l4kind { min-height: 44px; padding: 8px 12px; white-space: nowrap; }
.l4kind:disabled { opacity: .55; }

/* modos de juego y bots online */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modes .seg-opt { flex: none; min-height: 44px; }
.modes .seg-opt:last-child:nth-child(odd) { grid-column: 1 / -1; }
.check[hidden] { display: none; }
.modebar { background: var(--panel-2); color: var(--text); }
.seatrow { display: flex; gap: 8px; align-items: stretch; }
.seatrow .seat { flex: 1; }
.seat-bot { flex: none; border: 1px solid var(--line, #3a3f4b); background: transparent; color: inherit; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 600; cursor: pointer; }
.seat-bot:hover { border-color: var(--accent, #e8b04a); }
.clock.blitz .cturn { display: none; }

/* todos contra todos: cuatro paneles y jugadores eliminados */
.hud.ffa { grid-template-columns: 1fr 1fr; gap: 6px; }
.hud.ffa .player { padding: 6px 10px; }
.hud.ffa .player .caps { margin-top: 4px; }
.player.out { opacity: .4; }
.player.out .name { text-decoration: line-through; }
#localPlayers, #plPicker { display: grid; grid-template-columns: 1fr 1fr 1fr; }
#localPlayers .seg-opt, #plPicker .seg-opt { min-height: 52px; line-height: 1.15; }

/* Desafío diario */
.daily-info { margin: 14px 0 6px; text-align: center; font-weight: 700; font-size: 17px; }
.daily-res { margin: 12px 0; padding: 12px 14px; border-radius: 12px; text-align: center; font-weight: 700; background: var(--panel, rgba(0,0,0,.06)); border: 1px solid var(--line, rgba(0,0,0,.15)); }
#dailyOverlay .hint, #dailyOverlay .online-msg { text-align: center; }
.board { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.board li { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 10px; background: var(--panel, rgba(0,0,0,.06)); border: 1px solid var(--line, rgba(0,0,0,.12)); font-size: 14px; }
.board li.me { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; font-weight: 700; }
.board li .pos { font-weight: 800; text-align: center; opacity: .85; }
.board li .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board li .val { opacity: .85; font-variant-numeric: tabular-nums; white-space: nowrap; }
.board li.none { opacity: .6; }
.board li.gap { display: block; text-align: center; background: none; border: none; opacity: .6; padding: 2px; }
#boardTabs.btns { display: flex; flex-direction: row; gap: 8px; }
#boardTabs .btn { flex: 1; }

/* Jugar: tarjeta del desafío + fichas */
.hero { position: relative; display: block; width: 100%; margin: 14px 0 12px; padding: 18px 18px 16px; border-radius: 18px; text-align: left; overflow: hidden; color: var(--accent-ink);
  background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #fff 0%)); border: 0; box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 28%, transparent); }
.hero-board { position: absolute !important; right: -18px; top: -18px; width: 150px; height: 150px; pointer-events: none; transform: rotate(8deg);
  background-image: linear-gradient(rgba(0,0,0,0) 0, rgba(0,0,0,0) 0); }
.hero-board::before { content: ""; position: absolute; inset: 0; opacity: .22; color: inherit;
  background-image: linear-gradient(currentColor 1.5px, transparent 1.5px), linear-gradient(90deg, currentColor 1.5px, transparent 1.5px); background-size: 25px 25px; }
.hero-stone { position: absolute !important; width: 34px; height: 34px; pointer-events: none; }
.hero-stone.s1 { left: 58.75px; top: 83.75px; }
.hero-stone.s2 { left: 83.75px; top: 58.75px; }
.hero.done .hero-stone { opacity: .85; }
.ico { width: 1.05em; height: 1.05em; flex: none; vertical-align: -.14em; }
.hero-streak, .chip:has(.ico) { display: inline-flex; align-items: center; gap: 5px; }
.hero-sub:has(.ico) { display: flex !important; align-items: center; gap: 6px; }
.chip-sep { opacity: .6; }
.hero > * { position: relative; display: block; }
.hero-top { display: flex !important; align-items: center; justify-content: space-between; gap: 8px; }
.hero-tag { font-size: 11px; font-weight: 800; letter-spacing: .12em; opacity: .75; }
.hero-streak { font-size: 13px; font-weight: 800; background: rgba(0,0,0,.14); padding: 3px 9px; border-radius: 999px; }
.hero-title { font-size: 28px; font-weight: 800; line-height: 1.1; margin: 8px 0 4px; }
.hero-sub { font-size: 14px; opacity: .85; margin-right: 96px; min-height: 2.6em; }
.hero-cta { margin-top: 12px; font-weight: 800; font-size: 15px; }
.hero.done { background: var(--panel-2); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
.hero.done .hero-streak { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.hero.done .hero-cta { color: var(--accent); }
.hero:active { transform: scale(.985); }
.tiles { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
.tile { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); text-align: left; color: var(--text); }
.tile:hover { border-color: var(--accent); }
.tile.primary { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--text); }
.tile-ic { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--panel-2); color: var(--accent); }
.tile-tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile-t { font-weight: 800; font-size: 17px; }
.tile-s { font-size: 13px; color: var(--muted); line-height: 1.25; }
.chip { display: block; margin: -10px auto 18px; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.chip.done { color: var(--muted); background: transparent; border-color: var(--line); }
@media (prefers-reduced-motion: no-preference) { .hero, .tile { transition: transform .12s, border-color .15s; } }

/* XP y niveles */
.xpbar { display: block; height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--text) 12%, transparent); overflow: hidden; }
.xpbar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 80%, #000), var(--accent)); }
@media (prefers-reduced-motion: no-preference) { .xpbar > i { transition: width .7s cubic-bezier(.22,.8,.25,1); } .xpbar > i.jump { transition: none; } .xp-up { animation: xpPop .5s cubic-bezier(.2,1.3,.4,1); } }
@keyframes xpPop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.xpcard { margin: 14px 0 4px; padding: 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); text-align: left; }
.xpcard.prof { margin: 14px 0; }
.xp-gain { font-size: 26px; font-weight: 800; color: var(--accent); }
.xp-parts { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
.xp-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 6px 0 8px; }
.xp-lv { font-weight: 800; }
.xp-ttl { font-size: 13px; color: var(--muted); }
.xp-foot { font-size: 12px; color: var(--muted); margin-top: 6px; }
.xp-up { margin-top: 10px; padding: 9px 12px; border-radius: 10px; font-weight: 700; text-align: center; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.xpmini { background: none; border: 0; font: inherit; cursor: pointer; display: flex; align-items: center; gap: 10px; width: min(100%, 320px); margin: -6px auto 18px; padding: 6px 4px; font-size: 12px; color: var(--muted); }
.xpmini .xp-lv { color: var(--text); font-size: 13px; white-space: nowrap; }
.xpmini .xpbar { flex: 1; height: 7px; }
.xpmini .xp-txt { white-space: nowrap; min-width: 3.6em; text-align: right; }
.avatar-opt.locked { opacity: .45; filter: grayscale(1); }
.gem-opt.locked { opacity: .3; position: relative; }
.gem-opt.locked::after { content: "🔒"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; }
.xptoast { position: fixed; left: 50%; top: 14px; z-index: 60; transform: translate(-50%, -140%); padding: 10px 16px; border-radius: 999px; font-weight: 800; color: var(--accent-ink); background: var(--accent); box-shadow: 0 6px 20px rgba(0,0,0,.35); pointer-events: none; }
.xptoast.show { transform: translate(-50%, 0); }
@media (prefers-reduced-motion: no-preference) { .xptoast { transition: transform .35s cubic-bezier(.2,1.2,.4,1); } }

/* Nivel verificado junto al nombre (ranking, amigos, perfil) */
.lvchip { display: inline-block; margin-left: 7px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .02em; vertical-align: 1px; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }

/* Menú: tablero tenue de fondo (mismas fichas del juego) */
#menuBg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: .55;
  -webkit-mask-image: radial-gradient(ellipse 95% 85% at 50% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(ellipse 95% 85% at 50% 50%, #000 30%, transparent 100%); }
#menuOverlay .screen-body { position: relative; z-index: 1; }

/* Personajes de fichas */
.has-svg svg, .av-svg svg { display: block; width: 100%; height: 100%; }
.av-inline { display: inline-block; width: 1.5em; height: 1.5em; vertical-align: -.4em; }
.av-inline svg { display: block; width: 100%; height: 100%; }
.sq-av .has-svg, #avEmoji.has-svg { width: 38px; height: 38px; display: block; }
.fr-av.has-svg { width: 34px; height: 34px; display: block; flex: none; }
.pv-av.has-svg { width: 96px; height: 96px; display: block; }
.char-row { display: flex; align-items: center; gap: 14px; }
.char-prev { width: 76px; height: 76px; flex: none; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden; }
.char-prev svg { width: 100%; height: 100%; display: block; }
.cust-prev { width: 190px; height: 190px; margin: 6px auto 10px; border-radius: 22px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.cust-prev svg { width: 100%; height: 100%; display: block; }
.cust-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.cust-tabs button { flex: none; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-weight: 600; font-size: 13px; }
.cust-tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cust-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; margin-bottom: 8px; }
.cust-opt { position: relative; padding: 4px 4px 6px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 11px; font-weight: 600; text-align: center; }
.cust-opt .tile { display: block; width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg); }
.cust-opt .tile svg { display: block; width: 100%; height: 100%; }
.cust-opt[aria-pressed="true"] { border-color: var(--accent); }
.cust-opt.locked .tile { opacity: .4; filter: grayscale(1); }
.cust-opt .lk { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff; }
.sq-av .has-svg, #avEmoji.has-svg, .fr-av.has-svg { border-radius: 10px; overflow: hidden; }
.av-inline { border-radius: 6px; overflow: hidden; }

/* ---------- Flecha de volver, consejos y pantalla grande ---------- */
.backarrow { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); z-index: 3; width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); cursor: pointer; }
.backarrow:hover { border-color: var(--accent); }
.backarrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.overlay.screen:not(#menuOverlay) .screen-body { padding-top: 58px; }
.back-dup { display: none !important; }
.menu-tip { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translate(-50%, 16px); width: min(92vw, 520px); z-index: 2; box-sizing: border-box; padding: 11px 16px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0,0,0,.28); font-size: 14px; line-height: 1.4; text-align: center; opacity: 0; pointer-events: none; transition: opacity .45s, transform .45s; }
.menu-tip.on { opacity: 1; transform: translate(-50%, 0); }
.menu-tip[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .menu-tip { transition: opacity .2s; transform: translate(-50%, 0); } }

@media (min-width: 900px) {
  .screen-body { width: min(100%, 760px); }
  .screen-body.settings { width: min(100%, 760px); }
  #playOverlay .screen-body, #localOverlay .screen-body, #onlineOverlay .screen-body, #roomsOverlay .screen-body, #friendsOverlay .screen-body, #profileOverlay .screen-body, #tnOverlay .screen-body { width: min(100%, 980px); }
  .screen-body.wide { max-width: 980px; }
  .screen-body .btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .screen-body .btns .btn { min-height: 52px; }
  #playOverlay .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  #playOverlay .tile { height: 100%; }
  .overlay.screen:not(#menuOverlay) .screen-body { padding-top: 66px; }
  .backarrow { top: 18px; left: 22px; }

  /* Menú: marca a la izquierda, botones a la derecha */
  #menuOverlay .screen-body { width: min(100%, 1040px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 72px; align-items: center; margin: auto; }
  #menuOverlay .menu-top { grid-column: 1 / -1; }
  #menuOverlay .brand { grid-column: 1; grid-row: 2 / span 3; margin: 0; align-self: center; }
  #menuOverlay .brand h1 { font-size: clamp(72px, 9vw, 124px); }
  #menuOverlay .chip, #menuOverlay .xpmini { grid-column: 1; }
  #menuOverlay .btns { grid-column: 2; grid-row: 2 / span 3; display: flex; flex-direction: column; margin: 0; gap: 12px; }
  #menuOverlay .btns .btn { min-height: 56px; font-size: 18px; }
  .menu-tip { width: min(70vw, 620px); }
}

.btn.gamecfg { min-width: 48px; padding-left: 12px; padding-right: 12px; display: inline-flex; align-items: center; justify-content: center; }
body.in-tut .btn.gamecfg { display: none; }

.seek-txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.3; }
.seek-toast .btn.small { min-height: 38px; padding: 6px 12px; flex: none; }

<body>
<div class="app">
  <div class="hud">
    <div class="player" id="player1">
      <div class="row"><span class="stone-ico s1"></span><span class="name" id="pname1"></span></div>
      <div class="clock" id="clock1" hidden><span class="cturn"></span><span class="ctot"></span></div>
      <div class="caps" id="caps1" data-i18n-aria="a11y.captures"></div>
    </div>
    <div class="player" id="player2">
      <div class="row"><span class="stone-ico s2"></span><span class="name" id="pname2"></span></div>
      <div class="clock" id="clock2" hidden><span class="cturn"></span><span class="ctot"></span></div>
      <div class="caps" id="caps2" data-i18n-aria="a11y.captures"></div>
    </div>
    <div class="player" id="player3" hidden>
      <div class="row"><span class="stone-ico s3"></span><span class="name" id="pname3"></span></div>
      <div class="clock" id="clock3" hidden><span class="cturn"></span><span class="ctot"></span></div>
      <div class="caps" id="caps3" data-i18n-aria="a11y.captures"></div>
    </div>
    <div class="player" id="player4" hidden>
      <div class="row"><span class="stone-ico s4"></span><span class="name" id="pname4"></span></div>
      <div class="clock" id="clock4" hidden><span class="cturn"></span><span class="ctot"></span></div>
      <div class="caps" id="caps4" data-i18n-aria="a11y.captures"></div>
    </div>
  </div>

  <div class="specbar" id="specBar" hidden></div>
  <div class="specbar modebar" id="modeBar" hidden></div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="stage">
    <section class="tut-card" id="tutCard" hidden data-i18n-aria="a11y.tutorial">
      <div class="tut-top"><span class="tut-step" id="tutStep"></span><button type="button" class="btn small" id="tutExit"></button></div>
      <h2 class="tut-title" id="tutTitle"></h2>
      <p class="tut-text" id="tutText"></p>
      <p class="tut-fb" id="tutFb" role="status" aria-live="polite"></p>
      <div class="tut-btns">
        <button type="button" class="btn" id="tutPrev"></button>
        <button type="button" class="btn" id="tutHint"></button>
        <button type="button" class="btn" id="tutNext"></button>
      </div>
    </section>
    <div class="board-wrap"><canvas id="board" tabindex="0" role="application"></canvas></div>

    <aside class="side" id="side" data-tab="moves" data-i18n-aria="a11y.sidePanel">
      <div class="grip grip-sheet" id="sheetGrip" role="separator" aria-orientation="horizontal" tabindex="0" data-i18n-aria="chat.resize" data-i18n-title="chat.resize"></div>
      <div class="side-inner">
        <div class="side-head">
          <div class="side-tabs" role="tablist">
            <button type="button" class="tab" id="tabMoves" data-side="moves" aria-selected="true" data-i18n="side.moves"></button>
            <button type="button" class="tab" id="tabChat" data-side="chat" hidden><span data-i18n="chat.title"></span><b class="badge" id="chatBadge" hidden></b></button>
          </div>
          <button type="button" class="btn x" id="btnSideClose" data-i18n-aria="a11y.close">✕</button>
        </div>
        <section class="box" id="movesBox">
          <h3 data-i18n="side.moves"></h3>
          <ol class="movelist" id="movesList"></ol>
          <p class="hint" data-i18n="moves.legend"></p>
          <div class="box-actions">
            <button type="button" class="btn" id="btnCopyMoves" data-i18n="moves.copy"></button>
            <button type="button" class="btn" id="btnSaveMoves" data-i18n="moves.save"></button>
            <button type="button" class="btn" id="btnVideoMoves" hidden data-i18n="video.make"></button>
            <button type="button" class="btn" id="btnShareMoves" hidden data-i18n="moves.share"></button>
          </div>
        </section>
        <section class="box" id="chatBox" hidden>
          <div class="grip grip-chat" id="chatGrip" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="chat.resize" data-i18n-title="chat.resize"></div>
          <div class="box-head"><h3 data-i18n="chat.title"></h3><button type="button" class="btn small" id="btnChatHide" data-i18n="chat.hide"></button></div>
          <div class="people" id="chatPeople"></div>
          <div class="chatlog" id="chatLog" role="log" aria-live="polite"></div>
          <form class="chatform" id="chatForm" autocomplete="off">
            <input type="text" id="chatInput" maxlength="200" data-i18n-ph="chat.placeholder" enterkeyhint="send">
            <button type="submit" class="btn primary" data-i18n="chat.send"></button>
          </form>
        </section>
        <button type="button" class="btn" id="btnChatShow" hidden data-i18n="chat.show"></button>
      </div>
    </aside>
  </div>

  <div class="actions">
    <button class="btn" id="btnMenu" data-i18n="hud.menu"></button>
    <button class="btn gamecfg" id="btnGameCfg" data-i18n-aria="menu.settings" data-i18n-title="menu.settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <button class="btn" id="btnPause" hidden data-i18n="pause.btn"></button>
    <button class="btn" id="btnRestart" data-i18n="hud.restart"></button>
    <button class="btn" id="btnClaim" hidden data-i18n="online.claim"></button>
    <button class="btn primary" id="btnResult" hidden data-i18n="end.result"></button>
    <button class="btn primary" id="btnConfirm" hidden data-i18n="hud.confirm"></button>
  </div>
  <div class="actions sidebar-row"><button class="btn" id="btnSide"><span id="btnSideLbl"></span><b class="badge" id="sideBadge" hidden></b></button></div>
</div>

<!-- Menú principal (pantalla propia: el juego no se ve detrás) -->
<div class="overlay screen" id="menuOverlay">
  <canvas id="menuBg" aria-hidden="true"></canvas>
  <div class="menu-tip" id="menuTip" role="status" aria-live="polite" hidden></div>
  <div class="screen-body">

 *   var conn = PenteNet.connect(url, { onOpen, onMessage(msg), onState(estado) });
